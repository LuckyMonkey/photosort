# Human-readable policy consumed by operators and future adapters.
analysis:
  extensions: [jpg, jpeg, png, webp, gif, heic, heif, tif, tiff, bmp, avif]
  report_format: jsonl
  preserve_originals: true
sweeps:
  ocr:
    command: tesseract
    language: eng
    min_width: 160
    min_height: 80
  faces:
    command: face-detect
    write_xmp: false
    detector_version: opencv-haar-v1
  face_identity:
    status: planned
    method: human-in-the-loop-pairwise-subject-active-learning
    subject_types: [person, pet, other-living-subject]
    choices: [same-subject, different-subject, not-a-subject]
    chunk_images: 500
    ai_context_subjects: 50
    require_human_confirmation: true
    write_xmp: planned
    hard_negatives: [not-a-subject, false-positive, statue, illustration, wood-knot, text-artifact]
  gps:
    read_tags: [GPSLatitude, GPSLongitude, GPSAltitude, GPSDateTime]
    geocode: false
  swatch:
    color_buckets: 5
    dhash: true
    auto_delete: false
deduplication:
  exact_hash: sha256
  similar_action: review_only
  chooser_decisions: reports/duplicate-decisions.jsonl
